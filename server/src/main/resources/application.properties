spring.datasource.url=jdbc:postgresql://${GYM_BRO_DB_HOST:127.0.0.1}:${GYM_BRO_DB_PORT:15433}/${GYM_BRO_DB_NAME:gym_bro}
spring.datasource.username=${GYM_BRO_DB_USER:gym_bro_app}
